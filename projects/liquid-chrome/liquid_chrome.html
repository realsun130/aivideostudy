<script type="module">

// period optically centered between the two 5s (equal visual gaps)
{ const a = glyphs[4], p = glyphs[5], b = glyphs[6];
  const aR = a.x + a.bb.max.x, bL = b.x + b.bb.min.x, pw = p.bb.max.x - p.bb.min.x;
  p.x = (aR + bL) / 2 - pw / 2 - p.bb.min.x; }

for (const g of glyphs) { minX = Math.min(minX, g.x + g.bb.min.x); maxX = Math.max(maxX, g.x + g.bb.max.x); minY = Math.min(minY, g.bb.min.y); maxY = Math.max(maxY, g.bb.max.y); }

  g.x0 = g.x + g.bb.min.x; g.x1 = g.x + g.bb.max.x; g.y0 = g.y + g.bb.min.y; g.y1 = g.y + g.bb.max.y;
  g.c = new THREE.Vector3((g.x0 + g.x1) / 2, (g.y0 + g.y1) / 2, 0); }
const aMax = Math.max(...glyphs.map(g => g.area));
glyphs.forEach(g => g.r = 0.215 * Math.sqrt(g.area / aMax));
// clip slabs: midpoints between neighbours
const slabs = glyphs.map((g, i) => {
  const l = i === 0 ? -9 : (glyphs[i - 1].x1 + g.x0) / 2, r = i === N7 - 1 ? 9 : (g.x1 + glyphs[i + 1].x0) / 2;
  return new THREE.Vector4(l, r, -9, 9); });

// ---------- GPU SDF bake 2048x512 (jump flood) ----------
const TW = 2048, TH = 512, EXT_X = 2, EXT_Y = 0.5; // texture covers x[-2,2] y[-.5,.5]
const maskRT = rt(TW, TH, THREE.UnsignedByteType, THREE.NearestFilter);
{ const sc = new THREE.Scene(), mat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  for (const g of glyphs) { const geo = new THREE.ShapeGeometry(g.shapes, 24); geo.translate(g.x, g.y, 0); sc.add(new THREE.Mesh(geo, mat)); }
  const oc = new THREE.OrthographicCamera(-EXT_X, EXT_X, EXT_Y, -EXT_Y, -1, 1);
  renderer.setRenderTarget(maskRT); renderer.setClearColor(0x000000, 1); renderer.clear(); renderer.render(sc, oc); }
const jfaA = rt(TW, TH, THREE.FloatType, THREE.NearestFilter), jfaB = rt(TW, TH, THREE.FloatType, THREE.NearestFilter);

 void main(){ float c=M(vec2(0)); bool b = c!=M(vec2(1,0))||c!=M(vec2(-1,0))||c!=M(vec2(0,1))||c!=M(vec2(0,-1));
  gl_FragColor = b ? vec4(floor(gl_FragCoord.xy),0.,1.) : vec4(-1.); }`, { m: { value: maskRT.texture }, res: { value: RES } });

   vec4 v=texture2D(s,(q+.5)/res); if(v.x<0.) continue; float d=dot(v.xy-f,v.xy-f); if(d<bd){bd=d;best=v;} }
  gl_FragColor=best; }`, { s: { value: null }, res: { value: RES }, k: { value: 1 } });
const sdfRT = rt(TW, TH, THREE.HalfFloatType, THREE.LinearFilter);
const pFinal = pass(`uniform sampler2D s; uniform sampler2D m; uniform vec2 res; uniform float px;
 void main(){ vec2 f=floor(gl_FragCoord.xy); vec4 v=texture2D(s,(f+.5)/res); float d=(v.x<0.?1e3:length(v.xy-f))*px+.5*px;
  float inside=step(.5,texture2D(m,(f+.5)/res).r); gl_FragColor=vec4(inside>.5?-d:d,0.,0.,1.); }`,
  { s: { value: null }, m: { value: maskRT.texture }, res: { value: RES }, px: { value: 2 * EXT_X / TW } });

for (let k = 1024; k >= 1; k >>= 1) { pStep.u.s.value = src.texture; pStep.u.k.value = k; run(pStep, dst); [src, dst] = [dst, src]; }

pFinal.u.s.value = src.texture; run(pFinal, sdfRT);

  uSdf: { value: sdfRT.texture }, uSteps: { value: STEPS },
  uDrop: { value: Array.from({ length: N7 }, () => new THREE.Vector4()) },
  uDropV: { value: Array.from({ length: N7 }, () => new THREE.Vector4(1, 0, 0, 1)) },

  uBlob: { value: new THREE.Vector4(0, 0, 0, 0.62) }, uBlobS: { value: new THREE.Vector3(1, 1, 1) },
  uSmK: { value: 0.35 }, uNoiseAmp: { value: 0.05 }, uNoiseOff: { value: new THREE.Vector3() },
  uGlint: { value: -999 }, uCamPos: { value: new THREE.Vector3() }, uCamMat: { value: new THREE.Matrix3() },
  uTanH: { value: Math.tan(THREE.MathUtils.degToRad(15)) }, uRes: { value: new THREE.Vector2(W, W) }, uJit: { value: new THREE.Vector2() },

const COMMON = `
#define N7 7
uniform sampler2D uSdf; uniform int uSteps;
uniform vec4 uDrop[N7]; uniform vec4 uDropV[N7]; uniform float uK[N7]; uniform float uBev[N7];
uniform vec3 uGOff[N7]; uniform vec4 uSlab[N7];
uniform vec4 uBlob; uniform vec3 uBlobS; uniform float uSmK, uNoiseAmp; uniform vec3 uNoiseOff;

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}

  if(k<=0.) di=dropSDF(i,p); else if(k>=1.) di=glyphSDF(i,p); else di=mix(dropSDF(i,p),glyphSDF(i,p),k);
  d=smin(d,di,max(uSmK*(1.-k*k),1e-4)); }
